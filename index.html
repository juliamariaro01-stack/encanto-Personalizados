<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="apple-touch-icon" href="./Untitled%20design.png?v=3">
<meta name="theme-color" content="#D96F91">
<title>Encanto Personalizados</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#FDF2EC;
color:#4B3A45;
}

header{
background:linear-gradient(135deg,#D96F91,#9C75BD);
color:white;
padding:18px;
border-radius:0 0 24px 24px;
display:flex;
align-items:center;
gap:14px;
}

header img{
width:70px;
height:70px;
object-fit:contain;
background:white;
border-radius:50%;
padding:3px;
}

header h1{
margin:0;
font-size:22px;
}

header p{
margin:6px 0 0;
opacity:.95;
}

main{
padding:16px;
padding-bottom:90px;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
background:white;
padding:15px;
border-radius:16px;
box-shadow:0 2px 8px #0001;
border-left:4px solid #D96F91;
cursor:pointer;
transition:.15s;
}

.card:active{
transform:scale(.97);
}

.card b{
font-size:23px;
display:block;
margin-top:5px;
color:#735292;
}

section{
display:none;
}

section.active{
display:block;
}

h2{
font-size:20px;
margin:8px 0 14px;
color:#735292;
}

h3{
color:#735292;
}

button{
border:0;
border-radius:12px;
padding:12px 15px;
font-weight:bold;
cursor:pointer;
}

.primary{
background:#D96F91;
color:white;
}

.secondary{
background:#F0DDE5;
color:#735292;
}

.danger{
background:#C96B6B;
color:white;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #E4C8D3;
border-radius:10px;
margin:5px 0 10px;
background:white;
color:#4B3A45;
}

input:focus,
select:focus,
textarea:focus{
outline:none;
border-color:#9C75BD;
}

label{
font-size:13px;
font-weight:bold;
color:#735292;
}

.form{
background:white;
padding:16px;
border-radius:16px;
margin-top:15px;
box-shadow:0 2px 8px #0001;
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.order{
background:white;
padding:14px;
border-radius:15px;
margin:10px 0;
box-shadow:0 2px 7px #0001;
border-left:4px solid #9C75BD;
}

.order strong{
font-size:17px;
color:#735292;
}

.order small{
display:block;
margin:4px 0;
color:#666;
}

.status{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#F0DDE5;
color:#735292;
font-size:12px;
}

.money{
color:#D96F91;
font-weight:bold;
}

.empty{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
color:#777;
margin-top:12px;
}

.filtro{
background:#F0DDE5;
color:#735292;
padding:10px 12px;
border-radius:12px;
margin:8px 0 12px;
font-size:14px;
font-weight:bold;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
}

.filtro button{
padding:7px 10px;
font-size:12px;
}

.mes-relatorio{
background:white;
padding:15px;
border-radius:16px;
margin:10px 0;
box-shadow:0 2px 8px #0001;
border-left:4px solid #9C75BD;
}

.mes-relatorio h3{
margin:0 0 12px;
}

.mes-relatorio p{
margin:7px 0;
}

.mes-relatorio .valor{
font-weight:bold;
color:#735292;
}

.total-ano{
background:#F0DDE5;
padding:14px;
border-radius:14px;
margin-top:12px;
font-weight:bold;
color:#735292;
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
border-top:1px solid #E4C8D3;
display:flex;
justify-content:space-around;
padding:8px 4px;
z-index:10;
}

nav button{
background:none;
color:#777;
padding:7px;
font-size:11px;
}

nav button.active{
color:#D96F91;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<img src="Untitled%20design.png" alt="Encanto Personalizados">

<div>
<h1>Encanto Personalizados</h1>
<p>Controle de pedidos</p>
</div>
</header>

<main>

<!-- INÍCIO -->
<section id="home" class="active">

<h2>Resumo</h2>

<div class="cards">

<div class="card" onclick="filtrarStatus('todos')">
📦 Pedidos
<b id="total">0</b>
</div>

<div class="card" onclick="filtrarStatus('A entregar')">
🚚 A entregar
<b id="entregar">0</b>
</div>

<div class="card" onclick="filtrarStatus('Entregue')">
✅ Entregues
<b id="entregues">0</b>
</div>

<div class="card" onclick="filtrarStatus('receber')">
💰 A receber
<b id="receber">R$ 0,00</b>
</div>

</div>

<div class="form">

<h3>Acesso rápido</h3>

<div class="actions">

<button class="primary" onclick="abrirNovo()">
+ Novo pedido
</button>

<button class="secondary" onclick="filtrarStatus('todos')">
Ver pedidos
</button>

</div>

</div>

</section>


<!-- NOVO PEDIDO -->
<section id="novo">

<h2>Novo pedido</h2>

<div class="form">

<label>Cliente</label>
<input id="cliente" placeholder="Nome do cliente">

<label>WhatsApp</label>
<input id="whatsapp" placeholder="Ex.: 37999999999">

<label>Produto / serviço</label>
<input id="produto" placeholder="Ex.: Caixa personalizada">

<label>Quantidade</label>
<input id="qtd" type="number" value="1">

<label>Valor total</label>
<input id="valor" type="number" step="0.01" placeholder="0,00">

<label>Valor recebido</label>
<input id="recebido" type="number" step="0.01" placeholder="0,00">

<label>Data do pedido</label>
<input id="dataPedido" type="date">

<label>Data de entrega</label>
<input id="dataEntrega" type="date">

<label>Forma de pagamento</label>

<select id="pagamento">
<option>Pix</option>
<option>Dinheiro</option>
<option>Cartão</option>
<option>Transferência</option>
<option>Outro</option>
</select>

<label>Status</label>

<select id="status">
<option>Recebido</option>
<option>Em produção</option>
<option>A entregar</option>
<option>Entregue</option>
<option>Cancelado</option>
</select>

<label>Observações</label>

<textarea
id="obs"
rows="3"
placeholder="Detalhes do pedido"></textarea>

<div class="actions">

<button class="primary" onclick="salvar()">
Salvar pedido
</button>

<button class="secondary" onclick="ir('home')">
Cancelar
</button>

</div>

</div>

</section>


<!-- PEDIDOS -->
<section id="pedidos">

<h2>Pedidos</h2>

<div id="filtroAtual"></div>

<input
id="busca"
placeholder="🔎 Buscar cliente ou produto"
oninput="listar()">

<div id="lista"></div>

</section>


<!-- CLIENTES -->
<section id="clientes">

<h2>Clientes</h2>

<div class="form">

<label>Nome</label>

<input
id="novoCliente"
placeholder="Nome do cliente">

<label>WhatsApp</label>

<input
id="novoWhats"
placeholder="WhatsApp">

<button
class="primary"
onclick="addCliente()">

Cadastrar cliente

</button>

</div>

<div id="listaClientes"></div>

</section>


<!-- RELATÓRIO -->
<section id="relatorio">

<h2>Relatório</h2>

<div class="cards">

<div class="card">
💵 Vendido
<b id="vendido">R$ 0,00</b>
</div>

<div class="card">
💳 Recebido
<b id="recebidoTotal">R$ 0,00</b>
</div>

<div class="card">
📌 Em aberto
<b id="aberto">R$ 0,00</b>
</div>

</div>


<!-- VENDAS POR MÊS -->

<div class="form">

<h3>📊 Vendas por mês</h3>

<div id="vendasPorMes"></div>

</div>


<!-- BACKUP -->

<div class="form">

<button
class="secondary"
onclick="exportar()">

💾 Fazer backup

</button>

<button
class="secondary"
onclick="document.getElementById('importar').click()">

📂 Restaurar backup

</button>

<input
id="importar"
type="file"
accept=".json"
style="display:none"
onchange="importar(this)">

</div>

</section>

</main>


<!-- MENU -->

<nav>

<button
id="n-home"
class="active"
onclick="ir('home')">

🏠<br>
Início

</button>

<button
id="n-pedidos"
onclick="ir('pedidos')">

📦<br>
Pedidos

</button>

<button
id="n-novo"
onclick="abrirNovo()">

➕<br>
Novo

</button>

<button
id="n-clientes"
onclick="ir('clientes')">

👥<br>
Clientes

</button>

<button
id="n-relatorio"
onclick="ir('relatorio')">

📊<br>
Relatório

</button>

</nav>


<script>

let pedidos =
JSON.parse(
localStorage.getItem('encanto_pedidos') || '[]'
);

let clientes =
JSON.parse(
localStorage.getItem('encanto_clientes') || '[]'
);

let editando = null;

let filtroAtual = 'todos';


/* DINHEIRO */

const dinheiro = v =>
Number(v || 0).toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
);


/* SALVAR */

function salvarDados(){

localStorage.setItem(
'encanto_pedidos',
JSON.stringify(pedidos)
);

localStorage.setItem(
'encanto_clientes',
JSON.stringify(clientes)
);

}


/* NAVEGAÇÃO */

function ir(id){

document
.querySelectorAll('section')
.forEach(x =>
x.classList.remove('active')
);

document
.getElementById(id)
.classList.add('active');

document
.querySelectorAll('nav button')
.forEach(x =>
x.classList.remove('active')
);

let b =
document.getElementById('n-' + id);

if(b)
b.classList.add('active');


if(id === 'home')
dashboard();

if(id === 'pedidos')
listar();

if(id === 'clientes')
listarClientes();

if(id === 'relatorio')
relatorio();

window.scrollTo(0,0);

}


/* FILTRO DOS CARDS */

function filtrarStatus(status){

filtroAtual = status;

ir('pedidos');

listar();

}


/* NOVO PEDIDO */

function abrirNovo(){

editando = null;

document
.querySelectorAll('#novo input,#novo textarea')
.forEach(x => x.value='');

document.getElementById('qtd').value = 1;

document.getElementById('status').value =
'Recebido';

document.getElementById('pagamento').value =
'Pix';

document.getElementById('dataPedido').value =
new Date().toISOString().slice(0,10);

ir('novo');

}


/* SALVAR PEDIDO */

function salvar(){

let cliente =
document
.getElementById('cliente')
.value
.trim();

if(!cliente){

alert('Digite o nome do cliente.');

return;

}

let p = {

id: editando || Date.now(),

cliente: cliente,

whatsapp:
document.getElementById('whatsapp').value,

produto:
document.getElementById('produto').value,

qtd:
Number(
document.getElementById('qtd').value || 1
),

valor:
Number(
document.getElementById('valor').value || 0
),

recebido:
Number(
document.getElementById('recebido').value || 0
),

dataPedido:
document.getElementById('dataPedido').value,

dataEntrega:
document.getElementById('dataEntrega').value,

pagamento:
document.getElementById('pagamento').value,

status:
document.getElementById('status').value,

obs:
document.getElementById('obs').value

};


if(editando){

pedidos =
pedidos.map(
x => x.id === editando ? p : x
);

}else{

pedidos.push(p);

}

salvarDados();

alert('Pedido salvo com sucesso! ❤️');

filtroAtual = 'todos';

ir('pedidos');

}


/* LISTAR PEDIDOS */

function listar(){

let busca =
(
document.getElementById('busca')?.value || ''
).toLowerCase();


let arr = pedidos.filter(p => {

let correspondeStatus = true;

if(filtroAtual === 'A entregar'){

correspondeStatus =
p.status === 'A entregar';

}

else if(filtroAtual === 'Entregue'){

correspondeStatus =
p.status === 'Entregue';

}

else if(filtroAtual === 'receber'){

correspondeStatus =
Number(p.valor || 0) >
Number(p.recebido || 0);

}


let correspondeBusca =

String(p.cliente || '')
.toLowerCase()
.includes(busca)

||

String(p.produto || '')
.toLowerCase()
.includes(busca);

return correspondeStatus &&
correspondeBusca;

});


let filtroEl =
document.getElementById('filtroAtual');

if(filtroEl){

let nome = 'Todos os pedidos';

if(filtroAtual === 'A entregar')
nome = '🚚 Pedidos a entregar';

if(filtroAtual === 'Entregue')
nome = '✅ Pedidos entregues';

if(filtroAtual === 'receber')
nome = '💰 Pedidos a receber';


if(filtroAtual !== 'todos'){

filtroEl.innerHTML = `

<div class="filtro">

<span>${nome}</span>

<button
class="secondary"
onclick="filtrarStatus('todos')">

Ver todos

</button>

</div>

`;

}else{

filtroEl.innerHTML = '';

}

}


let el =
document.getElementById('lista');


if(!arr.length){

el.innerHTML =
'<div class="empty">Nenhum pedido encontrado.</div>';

return;

}


el.innerHTML =

arr.map(p => {

let falta =
Math.max(
0,
Number(p.valor || 0) -
Number(p.recebido || 0)
);


return `

<div class="order">

<strong>
${esc(p.cliente)}
</strong>

<small>
📦 ${esc(p.produto || 'Não informado')} — ${p.qtd}
</small>

<small>
📅 Pedido:
${p.dataPedido || 'Não definida'}
</small>

<small>
📅 Entrega:
${p.dataEntrega || 'Não definida'}
</small>

<small>
💰 Total:
<span class="money">
${dinheiro(p.valor)}
</span>
</small>

<small>
💳 A receber:
<span class="money">
${dinheiro(falta)}
</span>
</small>

<span class="status">
${esc(p.status)}
</span>

<div
class="actions"
style="margin-top:10px">

<button
class="secondary"
onclick="editar(${p.id})">

✏️ Editar

</button>

<button
class="secondary"
onclick="entregar(${p.id})">

✅ Entregue

</button>

<button
class="secondary"
onclick="receber(${p.id})">

💰 Recebi

</button>

${
p.whatsapp
?
`<button
class="secondary"
onclick="whats('${p.whatsapp}','${esc(p.cliente)}')">

💬 WhatsApp

</button>`
:''
}

<button
class="danger"
onclick="excluir(${p.id})">

Excluir

</button>

</div>

</div>

`;

}).join('');

}


/* EDITAR */

function editar(id){

let p =
pedidos.find(x => x.id === id);

if(!p)return;

editando = id;

for(
let k of
[
'cliente',
'whatsapp',
'produto',
'qtd',
'valor',
'recebido',
'dataPedido',
'dataEntrega',
'pagamento',
'status',
'obs'
]
)

document.getElementById(k).value =
p[k] ?? '';

ir('novo');

}


/* ENTREGAR */

function entregar(id){

let p =
pedidos.find(x => x.id === id);

if(p){

p.status = 'Entregue';

salvarDados();

listar();

dashboard();

}

}


/* RECEBER */

function receber(id){

let p =
pedidos.find(x => x.id === id);

if(p){

p.recebido = p.valor;

if(p.status === 'Recebido')
p.status = 'Em produção';

salvarDados();

listar();

dashboard();

}

}


/* EXCLUIR */

function excluir(id){

if(
confirm('Excluir este pedido?')
){

pedidos =
pedidos.filter(
x => x.id !== id
);

salvarDados();

listar();

dashboard();

}

}


/* WHATSAPP */

function whats(numero,nome){

let n =
numero.replace(/\D/g,'');

if(n.length === 11)
n = '55' + n;

window.open(
'https://wa.me/' +
n +
'?text=' +
encodeURIComponent(
'Olá ' + nome + '! 😊'
),
'_blank'
);

}


/* CLIENTES */

function addCliente(){

let nome =
document
.getElementById('novoCliente')
.value
.trim();

let whats =
document
.getElementById('novoWhats')
.value
.trim();

if(!nome)
return alert('Digite o nome.');


clientes.push({

id: Date.now(),

nome: nome,

whats: whats

});


salvarDados();

document.getElementById(
'novoCliente'
).value = '';

document.getElementById(
'novoWhats'
).value = '';

listarClientes();

}


/* LISTAR CLIENTES */

function listarClientes(){

let el =
document.getElementById(
'listaClientes'
);

if(!clientes.length){

el.innerHTML =
'<div class="empty">Nenhum cliente cadastrado.</div>';

return;

}


el.innerHTML =

clientes.map(c => `

<div class="order">

<strong>
${esc(c.nome)}
</strong>

<small>
📱 ${esc(c.whats || 'Não informado')}
</small>

</div>

`).join('');

}


/* DASHBOARD */

function dashboard(){

document.getElementById(
'total'
).textContent =
pedidos.length;


document.getElementById(
'entregar'
).textContent =

pedidos.filter(
p => p.status === 'A entregar'
).length;


document.getElementById(
'entregues'
).textContent =

pedidos.filter(
p => p.status === 'Entregue'
).length;


let r =
pedidos.reduce(
(s,p) =>
s +
Math.max(
0,
Number(p.valor || 0) -
Number(p.recebido || 0)
),
0
);


document.getElementById(
'receber'
).textContent =
dinheiro(r);

}


/* RELATÓRIO */

function relatorio(){

let vendido =
pedidos.reduce(
(s,p) =>
s + Number(p.valor || 0),
0
);

let rec =
pedidos.reduce(
(s,p) =>
s + Number(p.recebido || 0),
0
);


document.getElementById(
'vendido'
).textContent =
dinheiro(vendido);


document.getElementById(
'recebidoTotal'
).textContent =
dinheiro(rec);


document.getElementById(
'aberto'
).textContent =
dinheiro(vendido - rec);


/* RELATÓRIO MENSAL */

vendasPorMes();

}


/* VENDAS POR MÊS */

function vendasPorMes(){

const meses = [

'Janeiro',
'Fevereiro',
'Março',
'Abril',
'Maio',
'Junho',
'Julho',
'Agosto',
'Setembro',
'Outubro',
'Novembro',
'Dezembro'

];


let html = '';

let totalPedidosAno = 0;
let totalVendidoAno = 0;
let totalRecebidoAno = 0;


meses.forEach((mes,indice) => {


let vendas = pedidos.filter(p => {

if(!p.dataPedido)
return false;

let data =
new Date(
p.dataPedido + 'T00:00:00'
);

return data.getMonth() === indice;

});


if(!vendas.length)
return;


let vendido =
vendas.reduce(
(total,p) =>
total + Number(p.valor || 0),
0
);


let recebido =
vendas.reduce(
(total,p) =>
total + Number(p.recebido || 0),
0
);


let aberto =
vendido - recebido;


totalPedidosAno += vendas.length;

totalVendidoAno += vendido;

totalRecebidoAno += recebido;


html += `

<div class="mes-relatorio">

<h3>
📅 ${mes}
</h3>

<p>
📦 <strong>Pedidos:</strong>
${vendas.length}
</p>

<p>
💰 <strong>Vendido:</strong>

<span class="valor">
${dinheiro(vendido)}
</span>

</p>

<p>
💳 <strong>Recebido:</strong>

<span class="valor">
${dinheiro(recebido)}
</span>

</p>

<p>
📌 <strong>Em aberto:</strong>

<span class="valor">
${dinheiro(aberto)}
</span>

</p>

</div>

`;

});


if(!html){

html = `

<div class="empty">

Ainda não existem vendas
com data de pedido cadastrada.

</div>

`;

}else{

html += `

<div class="total-ano">

📊 TOTAL DO PERÍODO

<br><br>

📦 Pedidos:
${totalPedidosAno}

<br><br>

💰 Vendido:
${dinheiro(totalVendidoAno)}

<br><br>

💳 Recebido:
${dinheiro(totalRecebidoAno)}

<br><br>

📌 Em aberto:
${dinheiro(
totalVendidoAno - totalRecebidoAno
)}

</div>

`;

}


document.getElementById(
'vendasPorMes'
).innerHTML = html;

}


/* BACKUP */

function exportar(){

let dados = {

pedidos,

clientes,

data:
new Date().toISOString()

};


let a =
document.createElement('a');

a.href =
URL.createObjectURL(

new Blob(

[
JSON.stringify(
dados,
null,
2
)
],

{
type:'application/json'
}

)
);

a.download =
'backup-encanto.json';

a.click();

}


/* RESTAURAR BACKUP */

function importar(input){

let f =
input.files[0];

if(!f)return;

let r =
new FileReader();


r.onload = e => {

try{

let d =
JSON.parse(
e.target.result
);

pedidos =
d.pedidos || [];

clientes =
d.clientes || [];

salvarDados();

dashboard();

alert(
'Backup restaurado!'
);

}

catch{
